name: Build Habitualize App

on:
  push:
    branches:
      - main
      - tauri
  pull_request:
    branches:
      - main
      - tauri

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Build Windows Installer (.msi)
        run: npm run tauri build
        working-directory: ./frontend

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_Windows
          path: frontend/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Build macOS Installer (.dmg)
        run: npm run tauri build
        working-directory: ./frontend

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_macOS
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev || true
          # Handle missing libwebkit2gtk-4.0-dev
          if ! sudo apt-get install -y libwebkit2gtk-4.0-dev; then
            echo "libwebkit2gtk-4.0-dev not found, trying alternative versions..."
            sudo apt-get install -y libwebkit2gtk-4.0-37-dev || true
            sudo apt-get install -y libwebkit2gtk-4.0-36-dev || true
          fi

      - name: Build Linux Installers (.AppImage and .deb)
        run: npm run tauri build
        working-directory: ./frontend

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_Linux
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
