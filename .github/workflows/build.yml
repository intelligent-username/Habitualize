name: Build Habitualize App

on:
  push:
    branches:
      - main
      - tauri
  pull_request:
    branches:
      - main
      - tauri

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer (.msi)
        run: npm run tauri:build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_Windows
          path: src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install

      - name: Build macOS Installer (.dmg)
        run: npm run tauri:build

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install

      - name: Build Linux Installers (.AppImage and .deb)
        run: npm run tauri:build

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
