name: Build Habitualize App

on:
  push:
    branches:
      - main
      - tauri
  pull_request:
    branches:
      - main
      - tauri

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
        working-directory: ./frontend/src-tauri

      - name: Build Windows Installer (.msi)
        run: npm run tauri build
        working-directory: ./frontend

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_Windows
          path: frontend/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r backend/requirements.txt
        working-directory: ./frontend/src-tauri

      - name: Build macOS Installer (.dmg)
        run: npm run tauri build
        working-directory: ./frontend

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_macOS
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r backend/requirements.txt
        working-directory: ./frontend/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
          # Fallback to webkit2gtk-4.0 if 4.1 is not available
          if ! dpkg -l | grep -q libwebkit2gtk-4.1-dev; then
            echo "webkit2gtk-4.1 not found, trying 4.0 version..."
            sudo apt-get install -y libwebkit2gtk-4.0-dev || true
          fi

      - name: Build Linux Installers (.AppImage and .deb)
        run: npm run tauri build
        working-directory: ./frontend

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Habitualize_Linux
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
